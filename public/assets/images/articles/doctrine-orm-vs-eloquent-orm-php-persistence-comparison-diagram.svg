<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="FIG 1 · DATA MAPPER UNIT-OF-WORK VS. ACTIVE RECORD &amp; WORKER-SAFE PHP ORMS">
