        <text x="24" y="36" fill="#C6A15B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01 · ARCHITECTURE LAYER</text>
        <text x="24" y="70" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="600">Zod 4, Yup, Joi &amp; Ajv Schemas</text>
      </g>
  <g transform="translate(520, 405)">
        <rect width="388" height="98" rx="16" fill="#07150F" fill-opacity="0.92" stroke="#10B981" stroke-opacity="0.32" stroke-width="1.5"/>
        <text x="24" y="36" fill="#C6A15B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02 · ARCHITECTURE LAYER</text>
        <text x="24" y="70" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="600">ECharts, Chart.js, Highcharts &amp; D3</text>
      </g>
  <g transform="translate(110, 527)">
        <rect width="388" height="98" rx="16" fill="#07150F" fill-opacity="0.92" stroke="#10B981" stroke-opacity="0.32" stroke-width="1.5"/>
        <text x="24" y="36" fill="#C6A15B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03 · ARCHITECTURE LAYER</text>
        <text x="24" y="70" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="600">Three.js WebGL, GSAP, Motion &amp; Anime</text>
      </g>
  <g transform="translate(520, 527)">
        <rect width="388" height="98" rx="16" fill="#07150F" fill-opacity="0.92" stroke="#10B981" stroke-opacity="0.32" stroke-width="1.5"/>
        <text x="24" y="36" fill="#C6A15B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">04 · ARCHITECTURE LAYER</text>
        <text x="24" y="70" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="600">Axios, RxJS, Lodash &amp; Day.js/date-fns</text>
      </g>

