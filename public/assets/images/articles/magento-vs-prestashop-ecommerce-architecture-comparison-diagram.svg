  <text x="52" y="477" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Decision Rule: Select Magento/Shopware 6.7 for ERP-heavy B2B commerce, PrestaShop 9 for lean retail TCO, and TYPO3/Craft/Drupal for structured portals.</text>
