<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="FIG 1 · NEXT.JS APP ROUTER (RSC) VS. NUXT (NITRO ENGINE) REQUEST PIPELINE">
  <defs>
    <linearGradient id="dbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040806"/>
      <stop offset="100%" stop-color="#07140E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="20" fill="url(#dbg)" stroke="#10B981" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- Top Header -->
  <rect x="28" y="24" width="1144" height="58" rx="12" fill="#071811" stroke="#C6A15B" stroke-opacity="0.4" stroke-width="1"/>
  <text x="52" y="60" fill="#E5C78B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">FIG 1 · NEXT.JS APP ROUTER (RSC) VS. NUXT (NITRO ENGINE) REQUEST PIPELINE</text>
  <text x="1148" y="60" text-anchor="end" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">FULL-STACK META-FRAMEWORKS</text>

  <!-- Left Architecture Column -->
  <g transform="translate(28, 102)">
    <rect width="546" height="326" rx="16" fill="#06120D" stroke="#10B981" stroke-opacity="0.38" stroke-width="1.4"/>
    <text x="26" y="40" fill="#F8FAFC" font-family="Georgia, serif" font-size="22" font-weight="700">Next.js App Router (React 19)</text>
    <text x="26" y="66" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">React Server Components + Flight Stream + Server Actions</text>
    <g transform="translate(24, 86)">
      <rect width="498" height="44" rx="9" fill="#081B13" stroke="#10B981" stroke-opacity="0.25"/>
      <text x="18" y="28" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">1. Edge/Node Middleware -&gt; Route Matcher &amp; Auth Headers</text>
    </g>
    <g transform="translate(24, 142)">
      <rect width="498" height="44" rx="9" fill="#081B13" stroke="#10B981" stroke-opacity="0.25"/>
      <text x="18" y="28" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">2. Async Server Components Query DB Without Client JS</text>
    </g>
    <g transform="translate(24, 198)">
      <rect width="498" height="44" rx="9" fill="#081B13" stroke="#10B981" stroke-opacity="0.25"/>
      <text x="18" y="28" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">3. RSC Flight Payload Streams Suspense Boundaries</text>
    </g>
    <g transform="translate(24, 254)">
      <rect width="498" height="44" rx="9" fill="#081B13" stroke="#10B981" stroke-opacity="0.25"/>
      <text x="18" y="28" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">4. Selective Hydration Only on &quot;use client&quot; Leaves</text>
    </g>
  </g>

  <!-- Center Connector -->
  <g transform="translate(578, 240)">
    <line x1="0" y1="25" x2="44" y2="25" stroke="#C6A15B" stroke-width="2.5" stroke-dasharray="4 4"/>
    <circle cx="22" cy="25" r="14" fill="#071811" stroke="#E5C78B" stroke-width="2"/>
    <text x="22" y="30" text-anchor="middle" fill="#E5C78B" font-family="ui-monospace, monospace" font-size="12" font-weight="700">VS</text>
  </g>

  <!-- Right Architecture Column -->
  <g transform="translate(626, 102)">
    <rect width="546" height="326" rx="16" fill="#06120D" stroke="#C6A15B" stroke-opacity="0.42" stroke-width="1.4"/>
    <text x="26" y="40" fill="#F8FAFC" font-family="Georgia, serif" font-size="22" font-weight="700">Nuxt Full-Stack (Vue 3.5 + Nitro)</text>
    <text x="26" y="66" fill="#E5C78B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Universal SSR + Route Rules + h3 Portable Server</text>
    <g transform="translate(24, 86)">
      <rect width="498" height="44" rx="9" fill="#0B1711" stroke="#C6A15B" stroke-opacity="0.28"/>
      <text x="18" y="28" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">1. Nitro Route Rules (SSR / SWR / ISR / Prerender per URL)</text>
    </g>
    <g transform="translate(24, 142)">
      <rect width="498" height="44" rx="9" fill="#0B1711" stroke="#C6A15B" stroke-opacity="0.28"/>
      <text x="18" y="28" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">2. useAsyncData / $fetch Direct In-Memory Server Call</text>
    </g>
    <g transform="translate(24, 198)">
      <rect width="498" height="44" rx="9" fill="#0B1711" stroke="#C6A15B" stroke-opacity="0.28"/>
      <text x="18" y="28" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">3. Pinia + Devalue Payload Serialization into HTML</text>
    </g>
    <g transform="translate(24, 254)">
      <rect width="498" height="44" rx="9" fill="#0B1711" stroke="#C6A15B" stroke-opacity="0.28"/>
      <text x="18" y="28" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">4. Deploy Unchanged to Node, Cloudflare, Bun or Deno</text>
    </g>
  </g>

  <!-- Bottom Decision Strip -->
  <rect x="28" y="446" width="1144" height="50" rx="12" fill="#050F0A" stroke="#10B981" stroke-opacity="0.28"/>
  <text x="52" y="477" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Decision Rule: Choose Next.js for RSC zero-bundle trees &amp; React ecosystem; choose Nuxt for portable Nitro hosting &amp; Vue velocity.</text>
</svg>
