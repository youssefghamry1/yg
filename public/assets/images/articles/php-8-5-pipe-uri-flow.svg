<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none" role="img" aria-labelledby="php85Title php85Desc">
  <title id="php85Title">PHP 8.5 Pipe Operator and RFC 3986 URI Extension Execution Pipeline</title>
  <desc id="php85Desc">Architectural diagram comparing nested PHP 8.4 calls against linear left-to-right PHP 8.5 pipe operator stages, paired with the built-in RFC 3986 and WHATWG URI parser engine and staged legacy upgrade verification.</desc>
  <defs>
    <linearGradient id="bg85" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050806"/>
      <stop offset="50%" stop-color="#07130D"/>
      <stop offset="100%" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="gold85" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5C78B"/>
      <stop offset="100%" stop-color="#9A7638"/>
    </linearGradient>
    <marker id="arr85" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#C6A15B"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#bg85)" stroke="#143828" stroke-width="2"/>

  <!-- Header -->
  <text x="44" y="46" fill="#E5C78B" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">OFFICIAL PHP 8.5 ENGINE ARCHITECTURE</text>
  <text x="44" y="74" fill="#F8FAFC" font-family="Georgia, serif" font-size="22" font-weight="700">Left-to-Right Pipe Operator (|&gt;) &amp; Built-In RFC 3986 / WHATWG URI Engine</text>
  <rect x="940" y="28" width="216" height="36" rx="10" fill="#0A1E15" stroke="#C6A15B" stroke-opacity="0.5"/>
  <text x="1048" y="51" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="700">LATEST: PHP 8.5.12</text>

  <line x1="0" y1="94" x2="1200" y2="94" stroke="#0E2B1E"/>

  <!-- Top Band: Pipe Operator Flow -->
  <text x="44" y="130" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="700">1. FUNCTIONAL DATA PIPELINE WITH |&gt; (ZERO TEMP VARIABLES OR INSIDE-OUT NESTING)</text>

  <g transform="translate(44, 148)">
    <rect width="205" height="92" rx="14" fill="#0A1912" stroke="#1E3A2F" stroke-width="1.5"/>
    <text x="18" y="30" fill="#E5C78B" font-family="monospace" font-size="12" font-weight="700">$rawPayload</text>
    <text x="18" y="54" fill="#CBD5E1" font-family="sans-serif" font-size="12">Incoming API / Request</text>
    <text x="18" y="74" fill="#94A3B8" font-family="monospace" font-size="11">string | DTO input</text>
  </g>

  <line x1="252" y1="194" x2="294" y2="194" stroke="#C6A15B" stroke-width="2" marker-end="url(#arr85)"/>
  <text x="271" y="184" text-anchor="middle" fill="#E5C78B" font-family="monospace" font-size="12" font-weight="700">|&gt;</text>

  <g transform="translate(300, 148)">
    <rect width="240" height="92" rx="14" fill="#0A1912" stroke="url(#gold85)" stroke-width="1.5"/>
    <text x="18" y="30" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="700">trim(...)</text>
    <text x="18" y="54" fill="#CBD5E1" font-family="sans-serif" font-size="12">First-class callable receives</text>
    <text x="18" y="74" fill="#94A3B8" font-family="monospace" font-size="11">left value as single arg</text>
  </g>

  <line x1="544" y1="194" x2="586" y2="194" stroke="#C6A15B" stroke-width="2" marker-end="url(#arr85)"/>
  <text x="563" y="184" text-anchor="middle" fill="#E5C78B" font-family="monospace" font-size="12" font-weight="700">|&gt;</text>

  <g transform="translate(592, 148)">
    <rect width="265" height="92" rx="14" fill="#0A1912" stroke="url(#gold85)" stroke-width="1.5"/>
    <text x="18" y="30" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="700">fn($s) =&gt; normalize($s)</text>
    <text x="18" y="54" fill="#CBD5E1" font-family="sans-serif" font-size="12">Arrow closure adapts multi-</text>
    <text x="18" y="74" fill="#94A3B8" font-family="monospace" font-size="11">argument library functions</text>
  </g>

  <line x1="860" y1="194" x2="902" y2="194" stroke="#C6A15B" stroke-width="2" marker-end="url(#arr85)"/>
  <text x="879" y="184" text-anchor="middle" fill="#E5C78B" font-family="monospace" font-size="12" font-weight="700">|&gt;</text>

  <g transform="translate(908, 148)">
    <rect width="248" height="92" rx="14" fill="#072217" stroke="#10B981" stroke-width="1.8"/>
    <text x="18" y="30" fill="#A7F3D0" font-family="monospace" font-size="12" font-weight="700">clone($dto, [...])</text>
    <text x="18" y="54" fill="#ECFDF5" font-family="sans-serif" font-size="12">Immutable readonly DTO</text>
    <text x="18" y="74" fill="#6EE7B7" font-family="monospace" font-size="11">#[\NoDiscard] verified</text>
  </g>

  <!-- Bottom Band: Core Engine Pillars -->
  <text x="44" y="286" fill="#E5C78B" font-family="monospace" font-size="12" font-weight="700">2. RUNTIME SAFETY, STANDARDIZED URI PARSING &amp; STAGED UPGRADE GOVERNANCE</text>

  <g transform="translate(44, 304)">
    <rect width="352" height="136" rx="16" fill="#0A1912" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="20" y="32" fill="#FFFFFF" font-family="Georgia, serif" font-size="16" font-weight="700">Built-In URI Extension</text>
    <text x="20" y="58" fill="#CBD5E1" font-family="sans-serif" font-size="12">Replaces quirk-prone parse_url() with strict</text>
    <text x="20" y="78" fill="#CBD5E1" font-family="sans-serif" font-size="12">Uri\Rfc3986\Uri (uriparser) &amp; Uri\WhatWg\Url</text>
    <text x="20" y="98" fill="#CBD5E1" font-family="sans-serif" font-size="12">(Lexbor) preventing SSRF host spoofing.</text>
    <text x="20" y="122" fill="#6EE7B7" font-family="monospace" font-size="11">Always bundled in PHP 8.5 core</text>
  </g>

  <g transform="translate(424, 304)">
    <rect width="352" height="136" rx="16" fill="#0A1912" stroke="#C6A15B" stroke-opacity="0.5"/>
    <text x="20" y="32" fill="#FFFFFF" font-family="Georgia, serif" font-size="16" font-weight="700">Array &amp; Diagnostic Ergonomics</text>
    <text x="20" y="58" fill="#CBD5E1" font-family="sans-serif" font-size="12">Native array_first() &amp; array_last() read</text>
    <text x="20" y="78" fill="#CBD5E1" font-family="sans-serif" font-size="12">boundary values without mutating pointers;</text>
    <text x="20" y="98" fill="#CBD5E1" font-family="sans-serif" font-size="12">Fatal Error Backtraces accelerate debugging.</text>
    <text x="20" y="122" fill="#E5C78B" font-family="monospace" font-size="11">fatal_error_backtraces = On</text>
  </g>

  <g transform="translate(804, 304)">
    <rect width="352" height="136" rx="16" fill="#0A1912" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="20" y="32" fill="#FFFFFF" font-family="Georgia, serif" font-size="16" font-weight="700">Zero-Regression Migration Gate</text>
    <text x="20" y="58" fill="#CBD5E1" font-family="sans-serif" font-size="12">1. Run Rector + PHPStan level 8 on staging</text>
    <text x="20" y="78" fill="#CBD5E1" font-family="sans-serif" font-size="12">2. Audit Composer C-extensions (redis, imagick)</text>
    <text x="20" y="98" fill="#CBD5E1" font-family="sans-serif" font-size="12">3. Canary switch PHP-FPM socket per pool</text>
    <text x="20" y="122" fill="#6EE7B7" font-family="monospace" font-size="11">composer check-platform-reqs</text>
  </g>

  <text x="44" y="476" fill="#94A3B8" font-family="monospace" font-size="12">Youssef Ghamry Engineering Knowledge Base • Verified Against Official PHP.net 8.5 Release Notes</text>
</svg>
